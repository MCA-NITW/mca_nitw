name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    uses: mca-nitw/.github/.github/workflows/format-check.yml@main

  security:
    name: Security Scan
    uses: mca-nitw/.github/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (Vite)
        run: npm run build

      - name: Build (Vite, demo mode)
        run: npm run build -- --mode demo

  server-syntax:
    name: Server Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify server files parse
        run: for f in *.js models/*.js routes/*.js; do node --check "$f"; done
