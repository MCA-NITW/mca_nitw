name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build (CRA) for /mca_nitw/
        run: npm run build
        env:
          CI: true
          PUBLIC_URL: /mca_nitw

      # GitHub Pages has no SPA rewrites; serving index.html as the 404 page
      # lets deep links like /mca_nitw/contact load the React router.
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
