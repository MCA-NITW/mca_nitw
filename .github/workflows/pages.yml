name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # With no VITE_API_URL repository variable the site builds in demo mode
      # (bundled alumni data, sign-in kept in the tab). Set the variable to a
      # deployed API URL to switch the live site to real accounts.
      - name: Build (Vite) for /mca_nitw/
        run: npm run build -- --mode "$BUILD_MODE"
        env:
          BASE_PATH: /mca_nitw/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BUILD_MODE: ${{ vars.VITE_API_URL && 'production' || 'demo' }}

      # GitHub Pages has no SPA rewrites; serving index.html as the 404 page
      # lets deep links like /mca_nitw/contact load the React router.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
